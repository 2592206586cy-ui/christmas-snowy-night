<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>圣诞雪夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* Layout: 全屏夜景画布 — 玩家开铲车运雪堆雪人；左上标题+雪人计数，底部左右虚拟按键，完成时中央祝福 */
:root{
  color-scheme: dark;
  --sky-1:#0a1430; --sky-2:#15274d; --sky-3:#24426f;
  --snow-hi:#e9f1fb; --snow-mid:#c9dbef; --snow-lo:#7290bb;
  --ink:#f5f8ff; --ink-dim:#c9d6ec; --ink-faint:rgba(201,214,236,.6);
  --gold:#f4cd77; --gold-2:#ffe9b0;
  --glass:rgba(9,18,40,.55); --glass-brd:rgba(255,255,255,.14);
  --font-display:"ZCOOL KuaiLe","Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden; background:var(--sky-1); color:var(--ink);
  font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  user-select:none; -webkit-user-select:none;
}
[hidden]{display:none!important}
#scene{position:fixed; inset:0; display:block; cursor:crosshair; touch-action:none}
.hud{
  position:absolute; z-index:2;
  top:calc(env(safe-area-inset-top,0px) + 18px);
  left:max(20px,env(safe-area-inset-left,0px));
  right:max(20px,env(safe-area-inset-right,0px));
  display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;
  pointer-events:none;
}
.eyebrow{font-size:11px; letter-spacing:.34em; color:var(--gold); margin:0 0 7px; font-weight:500}
h1{margin:0; font-family:var(--font-display); font-weight:400; font-size:clamp(30px,6.5vw,46px); line-height:1.1; text-shadow:0 2px 16px rgba(4,10,28,.65)}
.sub{margin:9px 0 0; font-size:13px; color:var(--ink-dim); max-width:36ch; text-wrap:balance}
.pill{
  display:flex; align-items:center; gap:9px;
  background:var(--glass); border:1px solid var(--glass-brd);
  border-radius:999px; padding:9px 18px 10px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.pill-ico{font-size:18px; line-height:1}
.pill-body{min-width:0}
.pill-row{display:flex; align-items:baseline; gap:9px; font-size:13px; color:var(--ink-dim)}
.pill-num{font-variant-numeric:tabular-nums; color:var(--gold); font-weight:700}
.hint{
  position:absolute; z-index:2; left:0; right:0;
  bottom:calc(env(safe-area-inset-bottom,0px) + 88px);
  text-align:center; font-size:12px; color:var(--ink-faint); pointer-events:none;
}
.ctrl{position:absolute; z-index:3; display:flex; gap:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.ctrl-left{left:max(18px,env(safe-area-inset-left,0px))}
.ctrl-right{right:max(18px,env(safe-area-inset-right,0px))}
.ctrl button{
  width:52px; height:52px; border-radius:999px;
  background:var(--glass); border:1px solid var(--glass-brd); color:var(--ink);
  font-size:18px; cursor:pointer;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.ctrl button:active{background:rgba(255,255,255,.18)}
.ctrl button:focus-visible{outline:2px solid #fff; outline-offset:2px}
#btn-dump{width:auto; padding:0 22px; font-size:15px; color:var(--gold-2)}
.toast{
  position:absolute; z-index:4; top:calc(env(safe-area-inset-top,0px) + 118px);
  left:50%; transform:translateX(-50%);
  background:var(--glass); border:1px solid var(--glass-brd); border-radius:999px;
  padding:10px 24px; font-size:14px; color:var(--gold-2); white-space:nowrap;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  opacity:0; transition:opacity .4s ease; pointer-events:none;
}
.toast.show{opacity:1}
.banner{
  position:absolute; z-index:5; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  background:radial-gradient(ellipse at 50% 46%, rgba(7,14,32,.62), rgba(7,14,32,.84));
  text-align:center; opacity:0; transition:opacity .9s ease;
  pointer-events:none;
}
.banner.show{opacity:1}
.banner-title{
  font-family:var(--font-display); font-size:clamp(42px,10vw,68px); line-height:1.15;
  background:linear-gradient(180deg,var(--gold-2),var(--gold) 62%,#d9a441);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 20px rgba(244,205,119,.35));
}
.banner-sub{font-size:14px; color:var(--ink-dim); max-width:36ch; text-wrap:balance}
.banner button{
  pointer-events:auto; margin-top:10px; cursor:pointer;
  font-family:var(--font-body); font-size:14px; font-weight:500; color:#3c2a05;
  background:linear-gradient(180deg,var(--gold-2),var(--gold));
  border:none; border-radius:999px; padding:11px 26px;
  box-shadow:0 6px 22px rgba(244,205,119,.28);
  transition:transform .18s ease, box-shadow .18s ease;
}
.banner button:hover{transform:translateY(-2px)}
.banner button:active{transform:translateY(0)}
.banner button:focus-visible{outline:2px solid #fff; outline-offset:3px}
@media (max-width:520px){
  .sub{max-width:24ch}
}
</style>
</head>
<body>
<canvas id="scene" aria-label="圣诞雪夜：开铲车把雪运去堆雪人"></canvas>
<header class="hud">
  <div>
    <p class="eyebrow">MERRY CHRISTMAS</p>
    <h1>圣诞雪夜</h1>
    <p class="sub">开铲车把雪运到小旗子旁 · 堆满 4 个雪人通关</p>
  </div>
  <div class="pill">
    <span class="pill-ico">⛄</span>
    <div class="pill-body">
      <div class="pill-row"><span id="pill-label">已堆雪人</span><span class="pill-num" id="pill-num">×0</span></div>
    </div>
  </div>
</header>
<div class="hint" id="hint">A D / ← → 移动 · 空格 卸雪 · C 重新开始 · 画个心形有惊喜 ❤</div>
<div class="ctrl ctrl-left">
  <button id="btn-left" aria-label="向左移动">◀</button>
  <button id="btn-right" aria-label="向右移动">▶</button>
</div>
<div class="ctrl ctrl-right">
  <button id="btn-dump" aria-label="卸雪">⤒ 卸雪</button>
</div>
<div class="toast" id="toast" hidden></div>
<div class="banner" id="banner" hidden>
  <div class="banner-title">圣诞快乐付钰辰</div>
  <div class="banner-sub">第一个雪人堆成啦！加油付钰辰，继续开铲车，把更多雪堆成雪人</div>
  <button id="banner-ok">继续堆雪人</button>
</div>
<div class="banner" id="end-banner" hidden>
  <div class="banner-title">雪人 ×4 达成！</div>
  <div class="banner-sub">四个雪人排排站，恭喜你成功浪费了一定的时间。付钰辰铲雪大师，圣诞快乐！</div>
  <button id="end-again">再玩一次</button>
</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
const banner = document.getElementById('banner');
const bannerOk = document.getElementById('banner-ok');
const endBanner = document.getElementById('end-banner');
const endAgain = document.getElementById('end-again');
const hint = document.getElementById('hint');
const pillNum = document.getElementById('pill-num');
const toastEl = document.getElementById('toast');
const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnDump = document.getElementById('btn-dump');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const CELL = 7, BASE = 10, FLOOR = 6;
const CAP = 3200;          /* 一满斗的雪量 */
const PILE_NEED = 2;       /* 两斗雪堆一个雪人 */
const BALL_R = [36, 25, 17];
const SPOTS = [0.24, 0.42, 0.60, 0.78];   /* 雪堆位置轮换 */
const SAVE_KEY = 'snowy-night-v2';

let W = 0, H = 0, DPR = 1, groundY = 0, cols = 0;
let heights = null;
let pileP = 0;             /* 当前雪堆进度 0..1 */
let spotIdx = 0;
let count = 0;             /* 已堆雪人数 */
let snowmen = [];          /* [{x, t, sinkAt}] */
let firstBanner = false;
let ended = false;         /* 堆满 4 个雪人即通关 */
let elapsed = 0, last = performance.now(), saveT = 0;
let flakes = [], parts = [], stars = [], sparks = [], pines = [];
let windT = 0;
let holding = false, holdT = 0;
let lastPtr = {x: 0, y: 0};
let lastCount = -1;
let toastTimer = null;

/* 每次堆成雪人的鼓励语（随机抽取，避免连续重复） */
const CHEERS = [
  '哇你真是老奶奶！才完成 {n} 个雪人，纯废物不是吗！',
  '真是给你一肘子！雪人 ×{n} 达成！',
  '厉害！死了凤的就是不一样！',
  '死人军团 +1，越来越壮观！',
  'shit！第 {n} 个雪人你麻痹诞生！',
  '雪人排排站，越看越可爱！',
  '圣诞老人看到都会夸你！',
  '铲得漂亮！雪人 ×{n}！',
  '一车一车骨灰，堆出奇迹！',
  '太强了！雪人 ×{n}，继续冲！'
];
let lastCheer = -1;
function cheerText(){
  let i;
  do { i = Math.floor(Math.random()*CHEERS.length); }
  while(i === lastCheer && CHEERS.length > 1);
  lastCheer = i;
  return CHEERS[i].split('{n}').join(count);
}

/* ---- 手势魔法：画出完整符号，区域内雪花变成符号形状 ---- */
const TINT = {heart: '#f78fb0', star: '#f4cd77', circle: '#eef4fb'};
const MAGIC_TOAST = {
  heart: '画出了心形！雪花变成爱心啦 ❤',
  star: '画出了星星！雪花变成星星啦 ⭐',
  circle: '画出了圆圈！雪花变成雪球啦 ⚪'
};
const TPL_TH = {heart: 26, star: 26, circle: 22};
let templates = null;
let magic = null;      /* {x0,y0,x1,y1,until,kind} */
let magicT = 0;
let stroke = null;
let glowStrokes = [];

/* 按弧长重采样到 n 个点 */
function resamplePts(pts, n){
  if(pts.length < 8) return null;
  const dists = [0];
  for(let i=1;i<pts.length;i++) dists.push(dists[i-1] + Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
  const total = dists[dists.length-1];
  if(total < 50) return null;
  const out = [{x: pts[0].x, y: pts[0].y}];
  let k = 0;
  for(let s=1;s<n-1;s++){
    const target = total*s/(n-1);
    while(k < pts.length-2 && dists[k+1] < target) k++;
    const segLen = Math.max(dists[k+1]-dists[k], 0.0001);
    const t = (target-dists[k])/segLen;
    out.push({x: pts[k].x + t*(pts[k+1].x-pts[k].x), y: pts[k].y + t*(pts[k+1].y-pts[k].y)});
  }
  out.push({x: pts[pts.length-1].x, y: pts[pts.length-1].y});
  return out;
}

/* 归一化：旋转到指示角、缩放到 100、平移到原点 */
function normalizeStroke(pts, n){
  const rp = resamplePts(pts, n);
  if(!rp) return null;
  let cx = 0, cy = 0;
  for(const p of rp){ cx += p.x; cy += p.y; }
  cx /= rp.length; cy /= rp.length;
  const ang = Math.atan2(rp[0].y-cy, rp[0].x-cx);
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const rot = rp.map(p=>{
    const dx = p.x-cx, dy = p.y-cy;
    return {x: dx*ca + dy*sa, y: -dx*sa + dy*ca};
  });
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  for(const p of rot){
    if(p.x < minx) minx = p.x; if(p.x > maxx) maxx = p.x;
    if(p.y < miny) miny = p.y; if(p.y > maxy) maxy = p.y;
  }
  const s = 100/Math.max(maxx-minx, maxy-miny, 1);
  return rot.map(p=>({x: (p.x-minx)*s, y: (p.y-miny)*s}));
}

/* 与模板的最小平均距离（容忍任意起点与方向） */
function bestDistance(cand, tpl){
  const n = cand.length;
  let best = Infinity;
  for(let dir=0; dir<2; dir++){
    for(let s=0; s<n; s++){
      let sum = 0;
      for(let i=0;i<n;i++){
        const p = cand[(s+i)%n], q = tpl[i];
        sum += Math.hypot(p.x-q.x, p.y-q.y);
      }
      if(sum < best) best = sum;
    }
    cand = cand.slice().reverse();
  }
  return best/n;
}

function buildTemplates(){
  const N = 64;
  const heart = [], star = [], circle = [];
  for(let i=0;i<N;i++){
    const t = i/(N-1)*Math.PI*2;
    heart.push({x: 16*Math.pow(Math.sin(t),3), y: -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))});
    circle.push({x: 12*Math.cos(t), y: 12*Math.sin(t)});
    const seg = Math.floor(t/(Math.PI/5));
    const rad = (seg%2===0) ? 12 : 5;
    const a = -Math.PI/2 + t;
    star.push({x: Math.cos(a)*rad, y: Math.sin(a)*rad});
  }
  templates = [
    {name: 'heart', pts: normalizeStroke(heart, N)},
    {name: 'star', pts: normalizeStroke(star, N)},
    {name: 'circle', pts: normalizeStroke(circle, N)}
  ];
}

function tryRecognize(strokePts){
  if(!templates) buildTemplates();
  const cand = normalizeStroke(strokePts, 64);
  if(!cand) return;
  /* 要求接近闭合的一笔 */
  let total = 0;
  for(let i=1;i<strokePts.length;i++){
    total += Math.hypot(strokePts[i].x-strokePts[i-1].x, strokePts[i].y-strokePts[i-1].y);
  }
  const closeD = Math.hypot(strokePts[0].x-strokePts[strokePts.length-1].x, strokePts[0].y-strokePts[strokePts.length-1].y);
  if(closeD > total*0.35) return;
  let best = null;
  for(const tpl of templates){
    const d = bestDistance(cand, tpl.pts);
    if(d < TPL_TH[tpl.name] && (!best || d < best.d)) best = {name: tpl.name, d: d};
  }
  if(!best) return;
  const xs = strokePts.map(p=>p.x), ys = strokePts.map(p=>p.y);
  const x0 = Math.max(0, Math.min.apply(null, xs)-30);
  const x1 = Math.min(W, Math.max.apply(null, xs)+30);
  const y0 = Math.max(0, Math.min.apply(null, ys)-30);
  const y1 = Math.min(H, Math.max.apply(null, ys)+30);
  magic = {x0: x0, y0: y0, x1: x1, y1: y1, until: elapsed+7, kind: best.name};
  magicT = 0;
  glowStrokes.push({pts: strokePts, until: elapsed+0.8});
  spawn((x0+x1)/2, (y0+y1)/2, {n:26, vx:0, vy:-30, spread:130, g:220, life:1.2, size:2.2, colors:['#f78fb0','#f4cd77','#fff3d0','#eef4fb']});
  showToast(MAGIC_TOAST[best.name]);
}

const clamp = (v,a,b)=> v<a ? a : v>b ? b : v;
const rand = (a,b)=> a + Math.random()*(b-a);
const spotX = ()=> SPOTS[spotIdx]*W;
function easeOutBack(x){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); }
function easeOutCubic(x){ return 1 - Math.pow(1-x,3); }
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function surfaceY(x){
  const i = clamp(Math.floor(x/CELL), 0, cols-1);
  return groundY - heights[i];
}

function initHeights(){
  cols = Math.ceil(W/CELL) + 2;
  heights = new Float32Array(cols);
  for(let i=0;i<cols;i++){
    heights[i] = BASE + Math.sin(i*0.32)*1.6 + Math.sin(i*0.083+2.1)*2.2;
  }
}

function makeFlake(fromTop){
  return {
    x: rand(0, W),
    y: fromTop ? rand(-H*0.5, -6) : rand(-6, H),
    r: rand(0.8, 3.2),
    vy: rand(34, 92),
    ph: rand(0, Math.PI*2),
    amp: rand(6, 22),
    freq: rand(0.6, 2.0),
    a: rand(0.45, 0.95),
    drift: rand(0.4, 1.3),
    shape: null,
    tint: null
  };
}

const loader = {
  x: 100, dir: 1, vx: 0,
  mode: 'drive', t: 0, dumped: false,
  carry: 0, lift: 0, liftTarget: 0, exhaustT: 0
};

const keys = {left: false, right: false};

function spawn(x, y, o){
  if(parts.length > 420) return;
  const n = o.n || 1;
  const colors = o.colors || ['#eef4fb'];
  for(let i=0;i<n;i++){
    const ang = rand(0, Math.PI*2), sp = rand(0.35, 1)*(o.spread||60);
    parts.push({
      x: x, y: y,
      vx: (o.vx||0) + Math.cos(ang)*sp,
      vy: (o.vy||0) + Math.sin(ang)*sp,
      g: o.g||0, life: 0,
      ttl: (o.life||0.6)*(0.6+Math.random()*0.8),
      size: rand(0.6,1.4)*(o.size||2.4),
      color: colors[Math.floor(Math.random()*colors.length)]
    });
  }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  groundY = Math.round(H*0.8);
  initHeights();
  stars = [];
  const ns = Math.round(clamp(W/16, 40, 90));
  for(let i=0;i<ns;i++){
    stars.push({x:rand(0,W), y:rand(H*0.02, groundY*0.86), r:rand(0.5,1.6), ph:rand(0,Math.PI*2), tw:rand(0.6,2.2), g:Math.random()<0.16});
  }
  sparks = [];
  const nk = Math.round(clamp(W/22, 14, 46));
  for(let i=0;i<nk;i++){
    sparks.push({x:rand(0,W), ph:rand(0,Math.PI*2), tw:rand(0.5,1.8), g:Math.random()<0.3});
  }
  const cnt = Math.round(clamp(W/2.6, 150, 340)) * (reduced ? 0.6 : 1);
  flakes.length = 0;
  for(let i=0;i<cnt;i++) flakes.push(makeFlake(false));
  loader.x = clamp(loader.x, 84, W-84);
  /* 保存过的雪人按旧屏比例换算位置 */
  for(const s of snowmen){
    if(typeof s.f === 'number') s.x = s.f*W;
  }
}

function respawn(f){ Object.assign(f, makeFlake(true)); }

function updateSnow(dt){
  const wind = Math.sin(windT)*14 + 10;
  windT += dt*0.35;
  for(const f of flakes){
    if(magic && !f.shape && f.x >= magic.x0 && f.x <= magic.x1 && f.y >= magic.y0 && f.y <= magic.y1){
      f.shape = magic.kind;
      f.tint = TINT[magic.kind];
    }
    f.y += f.vy*dt;
    f.x += (wind*f.drift + Math.sin(elapsed*f.freq + f.ph)*f.amp*0.9)*dt;
    if(f.x < -8) f.x = W + 6; else if(f.x > W + 8) f.x = -6;
    const sy = surfaceY(f.x);
    if(f.y + f.r >= sy){
      const i = clamp(Math.floor(f.x/CELL), 0, cols-1);
      let add = 0.55 + f.r*0.22;
      if(heights[i] > 100) add *= 0.12;
      heights[i] = Math.min(110, heights[i] + add);
      if(i > 0) heights[i-1] = Math.min(110, heights[i-1] + add*0.35);
      if(i < cols-1) heights[i+1] = Math.min(110, heights[i+1] + add*0.35);
      if(f.r > 1.6 && !reduced){
        spawn(f.x, sy-1, {n:1, vx:0, vy:-rand(14,40), spread:26, g:320, life:0.45, size:1.6});
      }
      respawn(f);
    }
  }
}

function triggerDump(){
  if(loader.mode !== 'raise' && loader.carry > 10){
    loader.mode = 'raise'; loader.t = 0; loader.dumped = false;
  }
}

function completeSnowman(){
  pileP = 0;
  const sx = spotX();
  snowmen.push({x: sx, t: elapsed, sinkAt: -9});
  count++;
  spotIdx = (spotIdx + 1) % SPOTS.length;
  spawn(sx, groundY-120, {n:50, vx:0, vy:-40, spread:180, g:260, life:1.6, size:2.4, colors:['#f4cd77','#e05f5a','#7ec8a3','#eef4fb','#fff3d0']});
  showToast(cheerText());
  if(count === 1 && !firstBanner){
    firstBanner = true;
    banner.hidden = false;
    requestAnimationFrame(()=>requestAnimationFrame(()=>banner.classList.add('show')));
    hint.hidden = true;
  }
  /* 堆满 4 个雪人 = 通关，弹出结束语 */
  if(count >= 4 && !ended){
    ended = true;
    setTimeout(()=>{
      if(!banner.hidden){
        banner.classList.remove('show');
        banner.hidden = true;
      }
      endBanner.hidden = false;
      requestAnimationFrame(()=>requestAnimationFrame(()=>endBanner.classList.add('show')));
    }, 1600);
  }
  if(snowmen.length > 4) snowmen[0].sinkAt = elapsed;
  saveNow();
}

/* C 键：游戏重新开始（雪人沉雪化掉、进度清零、积雪铺平） */
function restartGame(){
  if(count === 0 && snowmen.length === 0 && pileP === 0 && !ended) return;
  for(const s of snowmen) s.sinkAt = elapsed;
  count = 0;
  pileP = 0;
  spotIdx = 0;
  firstBanner = false;
  ended = false;
  initHeights();
  if(!banner.hidden){
    banner.classList.remove('show');
    banner.hidden = true;
  }
  endBanner.classList.remove('show');
  endBanner.hidden = true;
  hint.hidden = false;
  saveNow();
  showToast('去你妈的付钰辰，雪人们都化回泥巴里了 ❄');
}

function resolveDump(){
  const L = loader;
  if(ended){
    /* 通关后卸雪不再计数，直接落回地面 */
    const i0 = clamp(Math.floor((L.x - 90)/CELL), 0, cols-1);
    const add = Math.min(L.carry/CELL/26, 20);
    for(let k=0;k<26;k++){
      const idx = clamp(i0+k, 0, cols-1);
      heights[idx] = Math.min(110, heights[idx] + add);
    }
    L.carry = 0;
    return;
  }
  const px = spotX();
  const mx = L.x + L.dir*46, my = groundY - 44;
  if(Math.abs(mx - px) < 80){
    pileP = Math.min(1, pileP + L.carry/(CAP*PILE_NEED));
    spawn(px, groundY-34, {n:18, vx:0, vy:-80, spread:90, g:300, life:0.9, size:3.0});
    if(pileP >= 1) completeSnowman();
  } else {
    /* 雪卸在地上，堆回雪面 */
    const i0 = clamp(Math.floor((L.x - 90)/CELL), 0, cols-1);
    const add = Math.min(L.carry/CELL/26, 20);
    for(let k=0;k<26;k++){
      const idx = clamp(i0+k, 0, cols-1);
      heights[idx] = Math.min(110, heights[idx] + add);
    }
    spawn(mx, my, {n:14, vx:L.dir*70, vy:-50, spread:60, g:340, life:0.8, size:2.8});
  }
  L.carry = 0;
  saveNow();
}

function updateLoader(dt){
  const L = loader;
  const v = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if(v !== 0){ L.dir = v; L.vx = v*130; }
  else L.vx = 0;
  L.x = clamp(L.x + L.vx*dt, 84, W-84);
  const si = clamp(Math.floor(L.x/CELL), 0, cols-1);
  const surf = groundY - heights[si];
  const moving = Math.abs(L.vx) > 1;
  if(L.mode === 'raise'){
    L.t += dt;
    L.liftTarget = 1;
    if(L.t > 0.8 && !L.dumped){
      L.dumped = true;
      resolveDump();
    }
    if(L.t > 1.2) L.mode = 'drive';
  } else {
    L.liftTarget = 0;
    if(moving && L.lift < 0.15){
      const a = L.dir > 0 ? L.x+16 : L.x-60;
      const b = L.dir > 0 ? L.x+60 : L.x-16;
      const i0 = clamp(Math.floor(a/CELL), 0, cols-1);
      const i1 = clamp(Math.floor(b/CELL), 0, cols-1);
      for(let i=i0;i<=i1;i++){
        if(heights[i] > FLOOR){
          const dh = Math.min(heights[i]-FLOOR, 3.2);
          heights[i] -= dh;
          L.carry = Math.min(CAP, L.carry + dh*CELL);
        }
      }
    }
  }
  L.lift += (L.liftTarget - L.lift)*Math.min(1, dt*3.2);
  if(moving){
    L.exhaustT -= dt;
    if(L.exhaustT <= 0){
      L.exhaustT = 1.4;
      spawn(L.x - L.dir*30, surf-48, {n:1, vx:-L.dir*8, vy:-28, spread:6, g:-30, life:1.1, size:3.4, colors:['rgba(214,224,240,.5)']});
    }
  }
  for(let i=0;i<cols;i++) heights[i] += (14-heights[i])*0.0004;
}

function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life += dt;
    if(p.life >= p.ttl){ parts.splice(i,1); continue; }
    p.vy += p.g*dt;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
  }
}

function updateSnowmen(dt){
  for(let i=snowmen.length-1;i>=0;i--){
    const s = snowmen[i];
    if(s.sinkAt > -9 && elapsed - s.sinkAt > 1.3) snowmen.splice(i,1);
  }
}

function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a1430');
  g.addColorStop(0.62, '#15274d');
  g.addColorStop(1, '#24426f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(){
  for(const s of stars){
    const a = reduced ? 0.75 : 0.4 + 0.6*(0.5+0.5*Math.sin(elapsed*s.tw + s.ph));
    ctx.globalAlpha = a*(s.g ? 0.85 : 0.55);
    ctx.fillStyle = s.g ? '#f4d98a' : '#eaf1fb';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMoon(){
  const mx = W*0.84, my = H*0.14, r = clamp(Math.min(W,H)*0.036, 18, 30);
  const halo = ctx.createRadialGradient(mx, my, r*0.5, mx, my, r*4.2);
  halo.addColorStop(0, 'rgba(255,240,205,.34)');
  halo.addColorStop(1, 'rgba(255,240,205,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(mx, my, r*4.2, 0, Math.PI*2); ctx.fill();
  const mg = ctx.createRadialGradient(mx-r*0.35, my-r*0.35, r*0.15, mx, my, r);
  mg.addColorStop(0, '#fdf6e3'); mg.addColorStop(1, '#e9d9ae');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(214,197,150,.5)';
  ctx.beginPath(); ctx.arc(mx-r*0.3, my+r*0.15, r*0.16, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+r*0.25, my-r*0.3, r*0.11, 0, Math.PI*2); ctx.fill();
}

function drawLights(){
  const sag = clamp(W*0.055, 26, 60);
  const colors = ['#f4cd77','#e05f5a','#7ec8a3','#7fa9e8'];
  const n = clamp(Math.round(W/120), 6, 14);
  const pts = [];
  for(let i=0;i<=n;i++){
    const t = i/n;
    pts.push([-10 + (W+20)*t, 8 + sag*4*t*(1-t)]);
  }
  ctx.strokeStyle = 'rgba(16,26,52,.9)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length-1;i++){
    const mx = (pts[i][0]+pts[i+1][0])/2, my = (pts[i][1]+pts[i+1][1])/2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  ctx.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]);
  ctx.stroke();
  for(let i=1;i<pts.length-1;i++){
    const x = pts[i][0], y = pts[i][1];
    const c = colors[i % 4];
    const blink = reduced ? 0.9 : 0.6 + 0.4*Math.sin(elapsed*1.7 + i*1.05);
    const g = ctx.createRadialGradient(x, y, 1, x, y, 14);
    g.addColorStop(0, 'rgba(255,240,200,'+(0.4*blink)+')');
    g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = blink;
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(x, y, 3.6, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(x-1.6, y-9, 3.2, 5.5);
    ctx.globalAlpha = 1;
  }
}

function pine(x, base, h, w, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  for(let i=0;i<3;i++){
    const yy = base - h*(0.40 + i*0.28);
    const ww = w*(1 - i*0.30);
    ctx.moveTo(x - ww, yy + h*0.16);
    ctx.lineTo(x, yy - h*0.30);
    ctx.lineTo(x + ww, yy + h*0.16);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(x - w*0.05, base - h*0.12, w*0.1, h*0.12);
}

function drawGround(){
  ctx.beginPath();
  ctx.moveTo(-4, H+4);
  ctx.lineTo(-4, groundY - heights[0]);
  for(let i=0;i<cols;i++) ctx.lineTo(i*CELL, groundY - heights[i]);
  ctx.lineTo(W+4, groundY - heights[cols-1]);
  ctx.lineTo(W+4, H+4);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, groundY-26, 0, H);
  g.addColorStop(0, '#d6e3f4');
  g.addColorStop(0.35, '#aebfda');
  g.addColorStop(1, '#6b87b3');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-4, groundY - heights[0]);
  for(let i=0;i<cols;i++) ctx.lineTo(i*CELL, groundY - heights[i]);
  ctx.strokeStyle = 'rgba(255,255,255,.42)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawSparkles(){
  for(const s of sparks){
    const i = clamp(Math.floor(s.x/CELL), 0, cols-1);
    const y = groundY - heights[i] - 2;
    const tw = reduced ? 0.5 : 0.5 + 0.5*Math.sin(elapsed*s.tw + s.ph);
    ctx.globalAlpha = 0.25 + 0.35*tw;
    ctx.fillStyle = s.g ? '#fff7dd' : '#eef4fb';
    ctx.fillRect(s.x, y, 1.4, 1.4);
  }
  ctx.globalAlpha = 1;
}

function gift(x, y, w, h, c, sc){
  ctx.fillStyle = c;
  ctx.fillRect(x - w/2, y - h*sc, w, h*sc);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillRect(x - 1.5, y - h*sc, 3, h*sc);
  ctx.fillRect(x - w/2, y - h*sc*0.62, w, 3);
  ctx.fillStyle = '#fff3d0';
  ctx.beginPath(); ctx.arc(x, y - h*sc, 3.4, 0, Math.PI*2); ctx.fill();
}

/* 通用雪人绘制：k=0..1 生长进度，yOff 下沉偏移 */
function drawSnowmanAt(sx, k, yOff, opts){
  opts = opts || {};
  const e = easeOutBack(clamp(k, 0, 1));
  const base = groundY - heights[clamp(Math.floor(sx/CELL), 0, cols-1)] + yOff;
  /* 影子 */
  ctx.fillStyle = 'rgba(10,22,48,.35)';
  ctx.beginPath();
  ctx.ellipse(sx, base+3, 44*e+6, 6.5, 0, 0, Math.PI*2);
  ctx.fill();
  const c0y = base - BALL_R[0]*e;
  const c1y = c0y - (BALL_R[0] + BALL_R[1])*e*0.78;
  const c2y = c1y - (BALL_R[1] + BALL_R[2])*e*0.80;
  /* 最新雪人的金色光晕 */
  if(opts.glow && k > 0.6){
    const g = ctx.createRadialGradient(sx, c1y, 8, sx, c1y, 140);
    g.addColorStop(0, 'rgba(244,205,119,.20)');
    g.addColorStop(1, 'rgba(244,205,119,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, c1y, 140, 0, Math.PI*2); ctx.fill();
  }
  /* 三球 */
  const cs = [[sx,c0y,BALL_R[0]],[sx,c1y,BALL_R[1]],[sx,c2y,BALL_R[2]]];
  for(const [cx,cy,r] of cs){
    if(e <= 0.01) continue;
    const R = r*e;
    const g = ctx.createRadialGradient(cx-R*0.32, cy-R*0.38, R*0.1, cx, cy, R);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.72, '#e4edf8');
    g.addColorStop(1, '#b3c9e2');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(70,100,145,.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  /* 脸 */
  const fs = clamp((k-0.45)/0.35, 0, 1);
  if(fs > 0){
    ctx.globalAlpha = fs;
    ctx.fillStyle = '#2c3648';
    ctx.beginPath(); ctx.arc(sx-6.5, c2y-2, 2.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+6.5, c2y-2, 2.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx-9, c2y+10, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx-3, c2y+12.5, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+3, c2y+12.5, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f0883f';
    ctx.beginPath();
    ctx.moveTo(sx+2, c2y+2);
    ctx.lineTo(sx+18, c2y+6);
    ctx.lineTo(sx+2, c2y+9);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(160,90,40,.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx+8, c2y+3.5); ctx.lineTo(sx+9.5, c2y+6.5);
    ctx.moveTo(sx+13, c2y+4.5); ctx.lineTo(sx+14, c2y+7);
    ctx.stroke();
    ctx.fillStyle = 'rgba(226,110,100,.32)';
    ctx.beginPath(); ctx.arc(sx-12, c2y+3, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+12, c2y-2, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  /* 纽扣 */
  const bs = clamp((k-0.5)/0.3, 0, 1);
  if(bs > 0){
    ctx.globalAlpha = bs;
    ctx.fillStyle = '#2c3648';
    ctx.beginPath(); ctx.arc(sx, c0y-14, 2.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx, c0y-2, 2.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx, c1y+2, 2.3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  /* 手臂 */
  const as = k;
  if(as > 0.01){
    const ay = c1y - 4;
    ctx.globalAlpha = as;
    ctx.strokeStyle = '#6b4a2f'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx - BALL_R[1]*0.86*e, ay);
    ctx.lineTo(sx - BALL_R[1]*0.86*e - 22*as, ay + 18*as);
    ctx.moveTo(sx - BALL_R[1]*0.86*e - 16*as, ay + 12*as);
    ctx.lineTo(sx - BALL_R[1]*0.86*e - 27*as, ay + 26*as);
    ctx.moveTo(sx + BALL_R[1]*0.86*e, ay);
    ctx.lineTo(sx + BALL_R[1]*0.86*e + 22*as, ay + 16*as);
    ctx.moveTo(sx + BALL_R[1]*0.86*e + 16*as, ay + 10*as);
    ctx.lineTo(sx + BALL_R[1]*0.86*e + 27*as, ay + 24*as);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* 围巾 + 圣诞帽 */
  const hs = clamp((k-0.72)/0.22, 0, 1);
  if(hs > 0){
    ctx.globalAlpha = hs;
    const ny = c1y - BALL_R[1]*0.86*e;
    ctx.fillStyle = '#d94f43';
    rr(sx-17, ny-5, 34, 10, 5); ctx.fill();
    ctx.fillStyle = '#b93c31';
    rr(sx-17, ny+1, 34, 4, 2); ctx.fill();
    ctx.fillStyle = '#d94f43';
    ctx.beginPath();
    ctx.moveTo(sx+9, ny+2);
    ctx.lineTo(sx+24, ny+16);
    ctx.lineTo(sx+15, ny+14);
    ctx.lineTo(sx+7, ny+5);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(sx+14, ny+14, 3, 7);
    ctx.fillRect(sx+18, ny+15, 3, 7);
    const by2 = c2y - BALL_R[2]*0.82*e;
    ctx.fillStyle = '#eef4fb';
    ctx.beginPath(); ctx.ellipse(sx, by2, 19, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d94f43';
    ctx.beginPath();
    ctx.moveTo(sx-15, by2-1);
    ctx.quadraticCurveTo(sx-2, by2-30, sx+14, by2-27);
    ctx.quadraticCurveTo(sx+6, by2-14, sx+15, by2+1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f4f8fd';
    ctx.beginPath(); ctx.arc(sx+16, by2-29, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  /* 礼物（最新一个雪人） */
  const gs = opts.gifts ? easeOutBack(clamp((k-0.88)/0.12, 0, 1)) : 0;
  if(gs > 0.01){
    ctx.globalAlpha = Math.min(1, gs);
    gift(sx + 40, base, 22, 16, '#d94f43', gs);
    gift(sx + 61, base, 18, 13, '#7ec8a3', gs);
    gift(sx + 51, base - 15, 15, 11, '#f4cd77', gs);
    ctx.globalAlpha = 1;
  }
}

function drawPile(){
  if(ended) return;
  const px = spotX();
  const i = clamp(Math.floor(px/CELL), 0, cols-1);
  const pb = groundY - heights[i];
  const w = 16 + 16*Math.pow(pileP, 0.5);
  const h = 5 + 30*Math.pow(pileP, 0.62);
  /* 靠近提示 */
  const near = Math.abs(loader.x + loader.dir*46 - px) < 95 && loader.carry > 10;
  if(near){
    const g = ctx.createRadialGradient(px, pb-30, 4, px, pb-30, 70);
    g.addColorStop(0, 'rgba(244,205,119,.28)');
    g.addColorStop(1, 'rgba(244,205,119,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, pb-30, 70, 0, Math.PI*2); ctx.fill();
    const txt = '按 空格 卸雪';
    ctx.font = '13px "Noto Sans SC","PingFang SC",sans-serif';
    const tw = ctx.measureText(txt).width;
    const by = pb - h - 58;
    ctx.fillStyle = 'rgba(9,18,40,.72)';
    rr(px-tw/2-12, by-20, tw+24, 26, 13); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ffe9b0';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, px, by-7);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
  /* 雪堆 */
  const g2 = ctx.createLinearGradient(0, pb-h-4, 0, pb);
  g2.addColorStop(0, '#f2f7fd');
  g2.addColorStop(1, '#c4d6ec');
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.moveTo(px-w, pb);
  ctx.quadraticCurveTo(px, pb-h, px+w, pb);
  ctx.lineTo(px+w, pb+2);
  ctx.lineTo(px-w, pb+2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px-w, pb);
  ctx.quadraticCurveTo(px, pb-h, px+w, pb);
  ctx.stroke();
  if(pileP > 0.05){
    const twk = reduced ? 0.5 : 0.5 + 0.5*Math.sin(elapsed*2.4);
    ctx.globalAlpha = 0.4 + 0.5*twk;
    ctx.fillStyle = '#fff';
    ctx.fillRect(px-3, pb-h-2, 2.5, 2.5);
    ctx.fillRect(px+4, pb-h+6, 2, 2);
    ctx.globalAlpha = 1;
  }
  /* 小旗标记 */
  ctx.strokeStyle = '#7a5c3a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(px+w+10, pb+2); ctx.lineTo(px+w+10, pb-46); ctx.stroke();
  ctx.fillStyle = '#d94f43';
  ctx.beginPath();
  ctx.moveTo(px+w+10, pb-46);
  ctx.lineTo(px+w+34, pb-39);
  ctx.lineTo(px+w+10, pb-32);
  ctx.closePath(); ctx.fill();
}

function drawLoader(){
  const L = loader;
  const si = clamp(Math.floor(L.x/CELL), 0, cols-1);
  const surf = groundY - heights[si];
  const moving = Math.abs(L.vx) > 1;
  const bob = moving ? Math.sin(elapsed*13)*1.1 : 0;
  const y = surf + bob;
  const wheelR = 13;
  const bx = L.x-30, by = y-wheelR-14, bw = 62, bh = 30;
  ctx.save();
  ctx.translate(L.x, 0);
  ctx.scale(L.dir, 1);
  ctx.translate(-L.x, 0);
  /* 车灯光束 */
  const beamA = moving ? 0.16 : 0.07;
  const bg = ctx.createLinearGradient(L.x+30, y, L.x+170, y);
  bg.addColorStop(0, 'rgba(255,224,160,' + beamA + ')');
  bg.addColorStop(1, 'rgba(255,224,160,0)');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(L.x+30, y-30);
  ctx.lineTo(L.x+170, y+6);
  ctx.lineTo(L.x+170, y-10);
  ctx.lineTo(L.x+30, y-22);
  ctx.closePath();
  ctx.fill();
  /* 车轮 */
  ctx.fillStyle = '#20242c';
  ctx.beginPath(); ctx.arc(L.x-16, y-wheelR, wheelR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(L.x+20, y-wheelR, wheelR, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3c4452';
  ctx.beginPath(); ctx.arc(L.x-16, y-wheelR, 5.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(L.x+20, y-wheelR, 5.5, 0, Math.PI*2); ctx.fill();
  /* 车身 */
  ctx.fillStyle = '#f0b429';
  rr(bx, by, bw, bh, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(140,90,10,.55)'; ctx.lineWidth = 1.2; ctx.stroke();
  /* 机舱 + 车窗 */
  ctx.fillStyle = '#d99e18';
  rr(bx+8, by+4, 22, 14, 4); ctx.fill();
  ctx.fillStyle = '#a8c4dc';
  rr(bx+12, by+7, 14, 9, 3); ctx.fill();
  /* 排气管 */
  ctx.fillStyle = '#8f6a10';
  ctx.fillRect(bx-3, by+2, 4, 12);
  /* 尾灯闪烁 */
  const blink = reduced ? 1 : 0.5 + 0.5*Math.sin(elapsed*5);
  ctx.globalAlpha = 0.35 + 0.65*blink;
  ctx.fillStyle = '#ff5d5d';
  ctx.beginPath(); ctx.arc(bx+4, by-4, 2.4, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  /* 摇臂 */
  ctx.strokeStyle = '#c98a1d';
  ctx.lineCap = 'round';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(L.x+26, by+6);
  ctx.lineTo(L.x+44, y-6);
  ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(L.x+26, by+6);
  ctx.lineTo(L.x+20, y-2);
  ctx.stroke();
  /* 铲斗 */
  ctx.save();
  ctx.translate(L.x+50, y-8);
  ctx.rotate(-L.lift*1.02);
  ctx.fillStyle = '#f0b429';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(38,0);
  ctx.lineTo(38,-11);
  ctx.lineTo(4,-22);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(140,90,10,.55)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  /* 斗齿 */
  ctx.fillStyle = '#c98a1d';
  for(let k=0;k<3;k++){ ctx.fillRect(9+k*11, 0, 4, 4); }
  /* 斗内积雪 */
  if(L.carry > 8){
    const mh = 3 + (L.carry/CAP)*22;
    ctx.fillStyle = '#f2f7fd';
    ctx.beginPath();
    ctx.moveTo(1,-4);
    ctx.quadraticCurveTo(19, -4-mh, 36, -3);
    ctx.lineTo(36,-1);
    ctx.lineTo(1,-1);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,170,210,.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

function drawShape(x, y, s, kind){
  ctx.beginPath();
  if(kind === 'heart'){
    ctx.moveTo(x, y + s*0.9);
    ctx.bezierCurveTo(x - s*1.2, y + s*0.15, x - s*0.75, y - s*0.9, x, y - s*0.32);
    ctx.bezierCurveTo(x + s*0.75, y - s*0.9, x + s*1.2, y + s*0.15, x, y + s*0.9);
    ctx.closePath();
  } else if(kind === 'star'){
    for(let i=0;i<10;i++){
      const a = -Math.PI/2 + i*Math.PI/5;
      const r = (i%2===0) ? s*1.15 : s*0.5;
      const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
      if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  } else {
    ctx.arc(x, y, s*0.75, 0, Math.PI*2);
  }
  ctx.fill();
}

function drawFlakes(){
  for(const f of flakes){
    ctx.globalAlpha = f.a * clamp(f.r/2.4, 0.55, 1);
    if(f.shape){
      ctx.fillStyle = f.tint || '#eef4fb';
      drawShape(f.x, f.y, f.r*1.9, f.shape);
    } else {
      ctx.fillStyle = '#eef4fb';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* 识别成功时，笔迹短暂发金光 */
function drawGlows(){
  for(let i=glowStrokes.length-1;i>=0;i--){
    const g = glowStrokes[i];
    if(elapsed > g.until){ glowStrokes.splice(i,1); continue; }
    const a = 1 - (g.until - elapsed)/0.8;
    ctx.globalAlpha = (1-a)*0.85;
    ctx.strokeStyle = '#ffd98a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(g.pts[0].x, g.pts[0].y);
    for(let k=1;k<g.pts.length;k++) ctx.lineTo(g.pts[k].x, g.pts[k].y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawParts(){
  for(const p of parts){
    ctx.globalAlpha = clamp(p.life/p.ttl, 0, 1)*0.9;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function updateCounter(){
  if(count !== lastCount){
    lastCount = count;
    pillNum.textContent = '×' + count;
  }
}

function showToast(text){
  toastEl.textContent = text;
  toastEl.hidden = false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>toastEl.classList.add('show')));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    toastEl.classList.remove('show');
    setTimeout(()=>{ toastEl.hidden = true; }, 500);
  }, 2200);
}

function burst(x, y){
  for(let i=0;i<26;i++){
    flakes.push({
      x: x + rand(-16,16), y: y + rand(-12,12),
      r: rand(0.8,3.0), vy: rand(34,92),
      ph: rand(0,Math.PI*2), amp: rand(6,20), freq: rand(0.8,2),
      a: rand(0.5,1), drift: rand(0.4,1.2)
    });
  }
  if(flakes.length > 620) flakes.splice(0, flakes.length-620);
  spawn(x, y, {n:6, vx:0, vy:0, spread:90, g:240, life:0.6, size:1.7, colors:['#f4cd77','#fff3d0']});
}

function saveNow(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      c: count, pile: pileP, si: spotIdx, fb: firstBanner, e: ended,
      sm: snowmen.map(s=>({f: s.x/W}))
    }));
  }catch(e){}
}

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(typeof o.c === 'number'){
      count = o.c|0;
      pileP = clamp(o.pile||0, 0, 1);
      spotIdx = (o.si|0) % SPOTS.length;
      firstBanner = !!o.fb;
      ended = !!o.e;
      snowmen = (Array.isArray(o.sm) ? o.sm : [])
        .map(s=>({x: clamp(s.f*W, 40, W-40), f: s.f, t: -999, sinkAt: -9}))
        .slice(-4);
      lastCount = -1;
    }
  }catch(e){}
}

function frame(now){
  const dt = clamp((now-last)/1000, 0, 0.05);
  last = now;
  elapsed += dt;
  saveT += dt;
  if(saveT > 5){ saveT = 0; saveNow(); }
  updateSnow(dt);
  updateLoader(dt);
  updateParts(dt);
  updateSnowmen(dt);
  if(holding){
    holdT += dt;
    if(holdT > 0.15){ holdT = 0; burst(lastPtr.x, lastPtr.y); }
  }
  if(magic){
    if(elapsed > magic.until) magic = null;
    else {
      magicT -= dt;
      if(magicT <= 0){
        magicT = 0.16;
        for(let i=0;i<2;i++){
          flakes.push({
            x: rand(magic.x0, magic.x1), y: magic.y0 - rand(0, 8),
            r: rand(1.2, 2.6), vy: rand(40, 80),
            ph: rand(0, Math.PI*2), amp: rand(6, 20), freq: rand(0.8, 2),
            a: rand(0.6, 1), drift: rand(0.4, 1.2),
            shape: magic.kind, tint: TINT[magic.kind]
          });
        }
      }
    }
  }
  if(count > 0 && !reduced && Math.random() < dt*1.5){
    const s = snowmen[snowmen.length-1];
    if(s) spawn(s.x + rand(-55,55), groundY - rand(40,140), {n:1, vx:0, vy:-20, spread:30, g:-40, life:1.2, size:1.6, colors:['#f4cd77','#fff3d0','#eef4fb']});
  }
  drawSky();
  drawStars();
  drawMoon();
  drawLights();
  for(const p of pines){
    const x = p.f*W;
    const h = groundY*(p.l ? 0.42 : 0.27)*p.s;
    pine(x, groundY+6, h, h*0.36, p.l ? '#0e2c33' : 'rgba(20,41,74,.85)');
  }
  /* 沉进雪里的雪人画在雪面之前 */
  for(const s of snowmen){
    if(s.sinkAt > -9){
      const p = clamp((elapsed - s.sinkAt)/1.2, 0, 1);
      drawSnowmanAt(s.x, 1, p*p*150, {});
    }
  }
  drawGround();
  drawSparkles();
  drawPile();
  for(let i=0;i<snowmen.length;i++){
    const s = snowmen[i];
    if(s.sinkAt > -9) continue;
    const k = clamp((elapsed - s.t)/0.9, 0, 1);
    const isLast = i === snowmen.length-1;
    drawSnowmanAt(s.x, k, 0, {glow: isLast, gifts: isLast});
  }
  drawLoader();
  drawGlows();
  drawFlakes();
  drawParts();
  updateCounter();
  requestAnimationFrame(frame);
}

/* ---- 输入 ---- */
cv.addEventListener('pointerdown', (e)=>{
  holding = true; holdT = 0;
  lastPtr = {x: e.clientX, y: e.clientY};
  stroke = [{x: e.clientX, y: e.clientY}];
  burst(e.clientX, e.clientY);
});
window.addEventListener('pointerup', ()=>{
  holding = false;
  if(stroke){
    const pts = stroke;
    stroke = null;
    tryRecognize(pts);
  }
});
window.addEventListener('pointercancel', ()=>{ holding = false; stroke = null; });
cv.addEventListener('pointermove', (e)=>{
  lastPtr = {x: e.clientX, y: e.clientY};
  if(stroke){
    const lp = stroke[stroke.length-1];
    if(Math.hypot(e.clientX-lp.x, e.clientY-lp.y) > 6) stroke.push({x: e.clientX, y: e.clientY});
  }
});

window.addEventListener('keydown', (e)=>{
  if(e.code === 'ArrowLeft' || e.code === 'KeyA'){
    keys.left = true; e.preventDefault();
  } else if(e.code === 'ArrowRight' || e.code === 'KeyD'){
    keys.right = true; e.preventDefault();
  } else if((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat){
    e.preventDefault();
    triggerDump();
  } else if(e.code === 'KeyC' && !e.repeat){
    e.preventDefault();
    restartGame();
  }
});
window.addEventListener('keyup', (e)=>{
  if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  else if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});
window.addEventListener('blur', ()=>{ keys.left = false; keys.right = false; });

function bindHold(btn, down, up){
  btn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); down(); });
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('contextmenu', (e)=>e.preventDefault());
}
bindHold(btnLeft, ()=>keys.left = true, ()=>keys.left = false);
bindHold(btnRight, ()=>keys.right = true, ()=>keys.right = false);
btnDump.addEventListener('pointerdown', (e)=>{ e.preventDefault(); triggerDump(); });

bannerOk.addEventListener('click', ()=>{
  banner.classList.remove('show');
  banner.hidden = true;
  hint.hidden = false;
});

endAgain.addEventListener('click', ()=>{
  endBanner.classList.remove('show');
  endBanner.hidden = true;
  restartGame();
});

window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveNow(); });

function initPines(){
  pines = [
    {f:0.07,s:0.75,l:0},{f:0.16,s:0.95,l:0},{f:0.27,s:0.62,l:0},{f:0.39,s:1.0,l:0},{f:0.52,s:0.7,l:0},{f:0.87,s:0.9,l:0},{f:0.94,s:0.65,l:0},
    {f:0.10,s:1.0,l:1},{f:0.31,s:0.72,l:1},{f:0.47,s:0.88,l:1},{f:0.90,s:0.55,l:1}
  ];
}

function init(){
  resize();
  initPines();
  loadSave();
  if(ended){
    endBanner.hidden = false;
    endBanner.classList.add('show');
  }
  requestAnimationFrame(frame);
}
init();
})();
</script>
